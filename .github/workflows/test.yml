name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: selftests (stdlib only)
        run: python token_autopsy.py --selftest
      - name: install pillow
        run: pip install pillow
      - name: visualize selftest
        run: python visualize.py --selftest
